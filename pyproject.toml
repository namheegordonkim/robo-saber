[project]
name = "robo-saber"
version = "0.1.0"
description = "Robo-Saber: Generating and Simulating VR Players"
requires-python = "==3.11.*"
dynamic = ["dependencies"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.dependencies]
python = "3.11.13.*"

[tool.pixi.pypi-dependencies]
robo-saber = { path = ".", editable = true }
datasets = "==5.0.1"
huggingface-hub = "==1.33.0"
tensorboard = "==2.21.0"

[tool.pixi.feature.phc.dependencies]
python = "3.8.*"
pip = "*"
setuptools = "*"

[tool.pixi.feature.phc.pypi-dependencies]
torch = "==2.2.1"
torchvision = "==0.17.1"
numpy = "==1.24.4"
scipy = "==1.10.1"
gym = "==0.26.2"
rl-games = "==1.1.4"
ray = "==2.9.3"
smplx = "==0.1.28"
chumpy = { git = "https://github.com/mattloper/chumpy.git", rev = "51d5afd92a8ded3637553be8cef41f328a1c863a" }
easydict = "==1.13"
joblib = "==1.3.2"
pyyaml = "==6.0.1"
tqdm = "==4.65.0"
xarray = "==2023.1.0"
h5netcdf = "==1.1.0"
h5py = "==3.11.0"
pillow = "==10.2.0"
imageio = "==2.34.0"
ninja = "==1.11.1.1"

[tool.pixi.feature.phc.activation.env]
PYTHONPATH = "$PIXI_PROJECT_ROOT"
LD_LIBRARY_PATH = "$CONDA_PREFIX/lib"

[tool.pixi.feature.phc.pypi-options]
no-build-isolation = ["chumpy"]

[tool.pixi.environments]
phc = { features = ["phc"], no-default-feature = true }

[tool.black]
line-length = 1000000

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.packages.find]
where = ["."]
include = [
    "beaty_common*",
    "vendor*",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

